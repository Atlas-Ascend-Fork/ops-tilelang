name: package

on:
  pull_request:
  push:
    branches: [main]

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install build tools
        run: python -m pip install build setuptools wheel setuptools-scm
      - name: Build wheel
        run: OPS_TILELANG_CI_TASK=wheel ./scripts/run_ci.sh
      - name: Install wheel
        run: python -m pip install --no-deps dist/ops_tilelang-*.whl
      - name: Verify installed metadata
        run: python -c "import cann_ops_tilelang; from importlib.metadata import version; assert version('ops-tilelang')"
