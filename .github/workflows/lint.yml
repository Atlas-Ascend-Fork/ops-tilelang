name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install lint tools
        run: python -m pip install ruff
      - name: Run lint checks
        run: OPS_TILELANG_CI_TASK=lint ./scripts/run_ci.sh
