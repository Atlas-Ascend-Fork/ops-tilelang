# Operator-level incremental pytest mapping.
# Format: <source-pattern> <test-path> [<test-path> ...], separated by whitespace.
# All paths are relative to the repository root; paths cannot contain spaces.
# Source patterns use Bash globs (*, ?, [...]); test paths are explicit files.
# Blank lines and full-line comments are ignored. The first matching row wins.
# Put specific patterns before broader ones. Use separate rows for source aliases.
# Missing test files are ignored by ut.sh (e.g. tests awaiting migration).
# Only operator sources are mapped; modeling integration paths are excluded.

