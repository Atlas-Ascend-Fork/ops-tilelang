# Files whose changes require running all L0 functional tests.
#
# Format: one repository-relative glob per line (Python fnmatch). Blank lines and
# full-line comments are ignored. Matching is based on pr_filelist.txt, so
# added, modified, and deleted paths can all trigger the full test scope.
# .gitcode/ is excluded by default so CI-only adjustments can skip operator tests.
# Add an explicit rule here if a CI path should require the full test scope.

src/cann_ops_tilelang/config.py
src/cann_ops_tilelang/utils.py

tests/conftest.py
tests/pytest_*_plugin.py
tests/testing/*

pyproject.toml
requirements*.txt
scripts/*.sh
